name: Release

# Manual only. A published version can never be reused, and rc.4 proved how that gets spent: the same version
# was published twice on 2026-04-12, first by workflow_dispatch from 62a8e17 and 23 minutes later by a push of
# the merge commit 8bba672. Identical trees, different SHAs - SourceLink stamps the commit into the assembly,
# so the second build produced a different MVID and a different PDB id. nuget.org rejected the nupkg as a
# duplicate but still accepted the symbols, then found they matched no published dll: "pdb(s) for a
# corresponding dll(s) not found in the nuget package". One trigger, one deliberate run.
on:
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    # Only from main. The workflow is dispatched by hand and checks out whatever ref the operator picked, so
    # without this it publishes from any branch - which is how 1.0.0-rc.7 reached nuget.org while main still
    # said rc.6, leaving the published package on a commit no tag or branch pointed at.
    if: github.ref == 'refs/heads/main'

    # Publishing is a deliberate act, not a side effect of merging. The environment adds a human gate, and the
    # trusted-publishing policy is bound to it, so a token can only be minted from a run that passed through it.
    environment: nuget

    permissions:
      contents: write  # tag the published commit
      id-token: write  # required for the OIDC token exchanged for a short-lived NuGet key

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore unit tests
        run: dotnet restore tests/SYT.Fiskaly.UnitTests/SYT.Fiskaly.UnitTests.csproj

      - name: Build unit tests
        run: dotnet build tests/SYT.Fiskaly.UnitTests/SYT.Fiskaly.UnitTests.csproj -c Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Run unit tests
        run: dotnet test tests/SYT.Fiskaly.UnitTests/SYT.Fiskaly.UnitTests.csproj -c Release --no-build

      # The library is built explicitly so packing does not depend on the test project's build as a side
      # effect. This is hygiene, not the fix for the rc.4 symbols failure - that one was cross-run, see the
      # trigger comment above.
      - name: Build library
        run: dotnet build src/SYT.Fiskaly/SYT.Fiskaly.csproj -c Release -p:ContinuousIntegrationBuild=true

      - name: Pack
        run: dotnet pack src/SYT.Fiskaly/SYT.Fiskaly.csproj -c Release --no-build -o ./artifacts -p:ContinuousIntegrationBuild=true

      # Minted immediately before the push: the temporary key lives one hour and each token buys exactly one.
      - name: NuGet login (OIDC to short-lived key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      # No --skip-duplicate: a second attempt at an already-published version must fail loudly rather than
      # quietly push mismatched symbols over it. The paired .snupkg is uploaded by this same command, so it is
      # not pushed separately - doing so was how rc.4's symbols reached nuget.org after its nupkg was skipped.
      - name: Push to NuGet
        run: |
          dotnet nuget push "./artifacts/*.nupkg" \
            --source "https://api.nuget.org/v3/index.json" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"

      # A published version has to be findable in the history afterwards. Until rc.8 the repository had no tags
      # at all, so "what shipped in rc.N" was answerable only by reading commit subjects - and rc.7 showed what
      # that costs when a publish happens off-branch.
      - name: Tag the published version
        run: |
          VERSION=$(grep -oPm1 '(?<=<Version>)[^<]+' src/SYT.Fiskaly/SYT.Fiskaly.csproj)
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "SYT.Fiskaly $VERSION"
          git push origin "v$VERSION"
