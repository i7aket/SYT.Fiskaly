name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    # Publishing is a deliberate act, not a side effect of merging. The environment adds a human gate, and the
    # trusted-publishing policy is bound to it, so a token can only be minted from a run that passed through it.
    environment: nuget

    permissions:
      contents: read
      id-token: write  # required for the OIDC token exchanged for a short-lived NuGet key

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore unit tests
        run: dotnet restore tests/SYT.Fiskaly.UnitTests/SYT.Fiskaly.UnitTests.csproj

      - name: Build unit tests
        run: dotnet build tests/SYT.Fiskaly.UnitTests/SYT.Fiskaly.UnitTests.csproj -c Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Run unit tests
        run: dotnet test tests/SYT.Fiskaly.UnitTests/SYT.Fiskaly.UnitTests.csproj -c Release --no-build

      # The library is built explicitly before packing. Previously only the TEST project was built and the
      # library was packed with --no-build, which relies on whatever happened to be in the output directory -
      # and a .pdb left over from a different build does not match the .dll, which is what nuget.org rejects
      # ("the uploaded symbols package contains pdb(s) for a corresponding dll(s) not found in the nuget
      # package"). That is the most plausible cause of the rc.4 symbols failure; the packaging itself is sound.
      - name: Build library
        run: dotnet build src/SYT.Fiskaly/SYT.Fiskaly.csproj -c Release -p:ContinuousIntegrationBuild=true

      - name: Pack
        run: dotnet pack src/SYT.Fiskaly/SYT.Fiskaly.csproj -c Release --no-build -o ./artifacts -p:ContinuousIntegrationBuild=true

      # Minted immediately before the push: the temporary key lives one hour and each token buys exactly one.
      - name: NuGet login (OIDC to short-lived key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        run: |
          dotnet nuget push "./artifacts/*.nupkg" \
            --source "https://api.nuget.org/v3/index.json" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --skip-duplicate

          if compgen -G "./artifacts/*.snupkg" > /dev/null; then
            dotnet nuget push "./artifacts/*.snupkg" \
              --source "https://api.nuget.org/v3/index.json" \
              --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
              --skip-duplicate
          fi
